    document.getElementById("statsDisplay").innerText = `📄 ${filtered.length} / ${qaData.length} entries`;
    
    if (filtered.length === 0) {
      container.innerHTML = `<div style="grid-column:1/-1; text-align:center; padding:3rem;">🤖 No matching results. Try another keyword or clear search.</div>`;
      return;
    }
    
    container.innerHTML = filtered.map(item => `
      <div class="qa-card">
        <div class="card-header">
          <div class="q-num">Q${item.id}</div>
          <div class="question">${escapeHtml(item.question)}</div>
        </div>
        <div class="card-body">
          <div class="answer">${formatAnswer(item.answer)}</div>
          ${item.tags ? `<div class="tag">🏷️ ${item.tags.join(', ')}</div>` : ''}
        </div>
      </div>
    `).join('');
  }
  
  function escapeHtml(str) {
    return str.replace(/[&<>]/g, function(m) {
      if (m === '&') return '&amp;';
      if (m === '<') return '&lt;';
      if (m === '>') return '&gt;';
      return m;
    }).replace(/[\uD800-\uDBFF][\uDC00-\uDFFF]/g, function(c) {
      return c;
    });
  }
  
  function formatAnswer(ans) {
    let formatted = ans.replace(/\n/g, '<br>');
    formatted = formatted.replace(/`([^`]+)`/g, '<code class="inline-code">$1</code>');
    formatted = formatted.replace(/(Example:.*?)(<br>|$)/gi, '<em>$1</em>');
    if (ans.includes('void setup') || ans.includes('int led') || ans.includes('Serial.begin')) {
      if (!ans.includes('<pre>')) {
        formatted = `<pre style="margin-top:0.6rem;">${escapeHtml(ans)}</pre>`;
      }
    }
    return formatted;
  }
  
  // event handlers
  let currentFilter = "all";
  let currentSearch = "";
  
  function update() {
    renderCards(currentSearch, currentFilter);
  }
  
  document.getElementById("searchInput").addEventListener("input", (e) => {
    currentSearch = e.target.value;
    update();
  });
  
  const filterBtns = document.querySelectorAll(".filter-btn");
  filterBtns.forEach(btn => {
    btn.addEventListener("click", () => {
      filterBtns.forEach(b => b.classList.remove("active"));
      btn.classList.add("active");
      currentFilter = btn.getAttribute("data-filter");
      update();
    });
  });
  
  // initial render
  update();
</script>
</body>
</html>
