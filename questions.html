    { id: 106, text: "Which WSN type handles real-time video?", type: "mcq", options: ["Terrestrial", "Multimedia WSNs", "Underground", "Underwater"], correct: "Multimedia WSNs", explanation: "Multimedia WSNs process audio/video." },
    { id: 107, text: "What does the 'const' keyword do in Arduino?", type: "text", correctKeywords: ["constant","read-only"], explanation: "Declares variable as read-only." },
    { id: 108, text: "If analogRead returns 512 on 5V reference, what voltage?", type: "numeric", correct: "2.5", explanation: "(512/1024)*5 = 2.5V." },
    { id: 109, text: "What is the max current per GPIO pin on ESP8266?", type: "text", correctKeywords: ["12ma","12mA"], explanation: "Around 12mA (safe limit)." },
    { id: 110, text: "What does ROT13 do to digits? (stays same?)", type: "mcq", options: ["Shifts digits", "Stays unchanged", "Converts to letters", "Removes"], correct: "Stays unchanged", explanation: "ROT13 only affects letters A-Z a-z." },
    { id: 111, text: "Name a non-volatile memory used in Arduino to store data.", type: "text", correctKeywords: ["eeprom","flash"], explanation: "EEPROM or Flash memory." },
    { id: 112, text: "XOR of 0xAA and 0xFF = ? (hex)", type: "text", correct: "0x55", explanation: "0xAA (10101010) XOR 0xFF = 0x55 (01010101)." },
    { id: 113, text: "Write simple Arduino code to set pin 9 as PWM output at 50% duty cycle.", type: "code_arduino", correctKeywords: ["pinMode","analogWrite","9"], explanation: "pinMode(9,OUTPUT); analogWrite(9,127);" },
    { id: 114, text: "What is the purpose of micros() precision?", type: "text", correctKeywords: ["microsecond","timing","short"], explanation: "Microsecond resolution timing." },
    { id: 115, text: "What is a common attack vector on IoT devices?", type: "text", correctKeywords: ["default password","insecure network"], explanation: "Default credentials, unencrypted communication." },
    { id: 116, text: "Which ESP8266 mode is used for lowest power periodic sensing?", type: "text", correctKeywords: ["deep sleep","timer wake"], explanation: "Deep sleep with timer wake-up." },
    { id: 117, text: "Explain what Zigbee's mesh topology provides.", type: "text", correctKeywords: ["self-healing","reliable","range"], explanation: "Self-healing and extended range via routing." },
    // EXTRA ASCII / XOR challenge
    { id: 118, text: "ASCII: What is the decimal value of uppercase 'X'?", type: "numeric", correct: "88", explanation: "ASCII X = 88." },
    { id: 119, text: "XOR challenge: given plaintext 'IoT' (ASCII 73,111,84) and key=20, calculate first encrypted byte (decimal):", type: "numeric", correct: "93", explanation: "73 XOR 20 = 93." },
    { id: 120, text: "Write Python code to decrypt XOR ciphertext with the same key (demonstrate XOR property).", type: "code_xor", correctKeywords: ["xor","^","ord","chr"], explanation: "Encryption and decryption are identical using XOR." }
  ];

  // Store user answers
  let userAnswers = JSON.parse(localStorage.getItem("iot_full_exam_answers")) || {};

  function saveAnswer(qid, value) {
    userAnswers[qid] = value;
    localStorage.setItem("iot_full_exam_answers", JSON.stringify(userAnswers));
    updatePreviewScore();
  }

  function evaluateQuestion(q, answer) {
    if (!answer || (Array.isArray(answer) && answer.length === 0)) return false;
    if (q.type === "mcq") return answer === q.correct;
    if (q.type === "numeric") return String(answer).trim() === String(q.correct);
    if (q.type === "text" && q.correctKeywords) {
      let ansLower = String(answer).toLowerCase();
      return q.correctKeywords.some(kw => ansLower.includes(kw.toLowerCase()));
    }
    if (q.type === "text" && !q.correctKeywords && q.correct) {
      return String(answer).trim().toLowerCase() === String(q.correct).toLowerCase();
    }
    if (q.type === "checkbox") {
      let correctArr = q.correct;
      let userArr = Array.isArray(answer) ? answer : [];
      if (correctArr.length !== userArr.length) return false;
      return correctArr.every(c => userArr.includes(c));
    }
    if (q.type === "code_xor" || q.type === "code_arduino") {
      let code = String(answer).toLowerCase();
      if (q.type === "code_xor") return (code.includes('^') || code.includes('xor')) && (code.includes('ord') || code.includes('chr'));
      if (q.type === "code_arduino") return code.includes('pinmode') || (code.includes('digitalwrite') && code.includes('delay'));
    }
    return false;
  }

  function computeScore() {
    let correct = 0;
    fullQuestionBank.forEach(q => {
      const ans = userAnswers[q.id];
      if (evaluateQuestion(q, ans)) correct++;
    });
    return { correct, total: fullQuestionBank.length };
  }

  function updatePreviewScore() {
    const { correct, total } = computeScore();
    document.getElementById("scoreDisplay").innerText = `Score: ${correct}/${total}`;
  }

  function renderAllQuestions() {
    const container = document.getElementById("questionsContainer");
    container.innerHTML = "";
    fullQuestionBank.forEach((q, idx) => {
      const card = document.createElement("div");
      card.className = "question-card";
      const saved = userAnswers[q.id] || (q.type === "checkbox" ? [] : "");
      let inputHtml = "";
      if (q.type === "mcq") {
        inputHtml = `<div class="options-area">` + q.options.map(opt => `
          <label class="option"><input type="radio" name="q_${q.id}" value="${escapeHtml(opt)}" ${saved === opt ? 'checked' : ''}><span>${escapeHtml(opt)}</span></label>
        `).join('') + `</div>`;
      } else if (q.type === "checkbox") {
        let savedArr = Array.isArray(saved) ? saved : [];
        inputHtml = `<div class="options-area">` + q.options.map(opt => `
          <label class="option"><input type="checkbox" name="q_${q.id}" value="${escapeHtml(opt)}" ${savedArr.includes(opt) ? 'checked' : ''}><span>${escapeHtml(opt)}</span></label>
        `).join('') + `</div>`;
      } else {
        inputHtml = `<textarea class="text-input" rows="2" placeholder="Type your answer...">${escapeHtml(typeof saved === 'string' ? saved : '')}</textarea>`;
        if (q.type === "code_xor") inputHtml = `<textarea class="text-input" rows="3" placeholder="Python XOR code ...">${escapeHtml(typeof saved === 'string' ? saved : '')}</textarea>`;
        if (q.type === "code_arduino") inputHtml = `<textarea class="text-input" rows="3" placeholder="Arduino code ...">${escapeHtml(typeof saved === 'string' ? saved : '')}</textarea>`;
      }
      card.innerHTML = `<div class="q-title"><span class="q-num">Q${q.id}</span></div><div class="q-text">${escapeHtml(q.text)}</div>${inputHtml}<div class="feedback" id="fb_${q.id}"></div>`;
      container.appendChild(card);
      // attach events
      if (q.type === "mcq") {
        card.querySelectorAll(`input[type="radio"]`).forEach(radio => radio.addEventListener('change', (e) => { if(radio.checked) saveAnswer(q.id, radio.value); }));
      } else if (q.type === "checkbox") {
        const cbs = card.querySelectorAll(`input[type="checkbox"]`);
        cbs.forEach(cb => cb.addEventListener('change', () => {
          const selected = Array.from(cbs).filter(ch => ch.checked).map(ch => ch.value);
          saveAnswer(q.id, selected);
        }));
      } else {
        const ta = card.querySelector('textarea');
        if(ta) ta.addEventListener('input', (e) => saveAnswer(q.id, ta.value));
      }
    });
    document.getElementById("totalQCount").innerText = fullQuestionBank.length;
    updatePreviewScore();
  }

  function displayFullFeedback() {
    fullQuestionBank.forEach(q => {
      const userAns = userAnswers[q.id];
      const isCorrect = evaluateQuestion(q, userAns);
      const fbDiv = document.getElementById(`fb_${q.id}`);
      if (fbDiv) {
        fbDiv.style.display = "block";
        fbDiv.className = `feedback ${isCorrect ? 'correct-feedback' : 'wrong-feedback'}`;
        let answerShow = (userAns && typeof userAns !== 'object') ? userAns.substring(0,100) : (Array.isArray(userAns) ? userAns.join(", ") : "No answer");
        fbDiv.innerHTML = `<strong>${isCorrect ? '✓ Correct' : '✗ Incorrect'}</strong><br>Your answer: ${answerShow}<br>📘 ${q.explanation || "Reference answer provided in materials."}`;
      }
    });
    const { correct, total } = computeScore();
    const resultDiv = document.getElementById("globalResult");
    resultDiv.style.display = "block";
    resultDiv.innerHTML = `<h2>📊 Exam Results</h2><p style="font-size:1.5rem; font-weight:bold;">${correct} / ${total} correct (${Math.round(correct/total*100)}%)</p><button id="localClearBtn" style="background:#facc15; border:none; padding:0.5rem 1rem; border-radius:2rem; margin-top:0.5rem; cursor:pointer;">🗑️ Clear All Answers & Reset</button>`;
    document.getElementById("localClearBtn")?.addEventListener("click", () => {
      localStorage.removeItem("iot_full_exam_answers");
      userAnswers = {};
      renderAllQuestions();
      document.querySelectorAll('.feedback').forEach(fb => fb.style.display = 'none');
      resultDiv.style.display = "none";
    });
  }

  function escapeHtml(str) { if(!str) return ""; return str.replace(/[&<>]/g, function(m){ if(m==='&') return '&amp;'; if(m==='<') return '&lt;'; if(m==='>') return '&gt;'; return m;}); }

  document.getElementById("submitExamBtn").addEventListener("click", () => { displayFullFeedback(); });
  document.getElementById("resetAllBtn").addEventListener("click", () => {
    localStorage.removeItem("iot_full_exam_answers");
    userAnswers = {};
    renderAllQuestions();
    document.querySelectorAll('.feedback').forEach(fb => fb.style.display = 'none');
    document.getElementById("globalResult").style.display = "none";
  });
  renderAllQuestions();
</script>
</body>
</html>
