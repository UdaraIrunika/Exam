    // ORIGINAL 40 (IDs 1-40)
    { id: 1, question: "What is Non-Repudiation in Information Security?", answer: "Non-repudiation is a security principle that ensures a user cannot deny performing an action such as sending a message or making a transaction.\n\nIt provides proof of:\n- Message origin\n- User identity\n- Data integrity\n\n📌 Example: Digital signatures in emails ensure the sender cannot deny sending the message.", tags: ["encryption","security"] },
    { id: 2, question: "Compare DoS and DDoS Attacks", answer: "| DoS | DDoS |\n|---|---|\n| Single attacking system | Multiple attacking systems |\n| Easier to stop | Harder to stop |\n| Less traffic volume | Massive traffic volume |\n| One source IP | Many source IPs |\n\n**Mitigation**\nDoS: Firewall filtering, Rate limiting\nDDoS: Load balancing, Anti-DDoS services, Traffic filtering", tags: ["attacks","network"] },
    { id: 3, question: "Explain Digital Signature", answer: "A digital signature is a cryptographic method used to verify:\n- Authenticity\n- Integrity\n- Non-repudiation\n\nIt uses asymmetric encryption with:\n- Private key for signing\n- Public key for verification", tags: ["encryption","security"] },
    { id: 4, question: "What is PKI?", answer: "PKI (Public Key Infrastructure) is a framework used to manage:\n- Digital certificates\n- Public keys\n- Encryption services\n\nPKI helps secure communication over networks.", tags: ["encryption","security"] },
    { id: 5, question: "What is a Certificate Authority (CA)?", answer: "A Certificate Authority is a trusted organization that issues and validates digital certificates.\n\nExamples:\n- DigiCert\n- Let's Encrypt", tags: ["encryption","security"] },
    { id: 6, question: "Explain Four Types of Malware", answer: "**Virus** – Attaches to files and spreads when executed.\n**Worm** – Self-replicates automatically across networks.\n**Trojan** – Disguised as legitimate software.\n**Ransomware** – Encrypts files and demands payment.", tags: ["attacks"] },
    { id: 7, question: "Difference Between IDS and IPS", answer: "| IDS | IPS |\n|---|---|\n| Detects attacks | Detects and blocks attacks |\n| Passive system | Active system |\n| Sends alerts | Prevents malicious traffic |", tags: ["network","security"] },
    { id: 8, question: "What is a Next-Generation Firewall (NGFW)?", answer: "An NGFW is an advanced firewall that provides:\n- Deep packet inspection\n- Application awareness\n- Intrusion prevention\n- Malware filtering", tags: ["network","security"] },
    { id: 9, question: "What is a Proxy Server?", answer: "A proxy server acts as an intermediary between clients and external servers.\n\nFunctions:\n- Hide IP addresses\n- Content filtering\n- Improve security", tags: ["network","security"] },
    { id: 10, question: "What is NAC?", answer: "NAC (Network Access Control) controls device access to a network based on security policies.\n\nIt checks:\n- Device compliance\n- Authentication\n- Security posture", tags: ["network","security"] },
    { id: 11, question: "What is SIEM?", answer: "SIEM stands for: Security Information and Event Management.\n\nIt collects and analyzes security logs from multiple devices.\n\n**Features**\n- Real-time monitoring\n- Threat detection\n- Log management\n- Incident analysis", tags: ["security","network"] },
    { id: 12, question: "Explain Baseline Monitoring", answer: "Baseline monitoring records normal network behavior so unusual activity can be detected later.", tags: ["security","network"] },
    { id: 13, question: "What is Real-Time Alerting?", answer: "Real-time alerting immediately notifies administrators about suspicious activities or attacks.", tags: ["security"] },
    { id: 14, question: "What is an Incident Response Plan?", answer: "An Incident Response Plan is a structured process for:\n- Detecting incidents\n- Containing attacks\n- Recovering systems", tags: ["security"] },
    { id: 15, question: "Difference Between HTTPS and SSL/TLS", answer: "| HTTPS | SSL/TLS |\n|---|---|\n| Secure version of HTTP | Encryption protocol |\n| Used for websites | Provides encryption |\n| Uses SSL/TLS | Protects communication |", tags: ["encryption","network"] },
    { id: 16, question: "What is a VPN Concentrator?", answer: "A VPN concentrator manages multiple VPN connections securely in enterprise networks.\n\nFunctions:\n- Encryption\n- Authentication\n- Tunnel management", tags: ["network","encryption"] },
    { id: 17, question: "Match the Following: Security Terms", answer: "🔹 Encryption → AES\n🔹 Secure Remote Access → SSH\n🔹 Authentication → RADIUS\n🔹 Key Exchange → IKE", tags: ["encryption","security"] },
    { id: 18, question: "What is Multi-Factor Authentication (MFA)?", answer: "MFA requires users to provide multiple verification factors before access is granted.\n\n**Types of Factors**\n1. Something you know → Password\n2. Something you have → OTP token\n3. Something you are → Fingerprint", tags: ["security"] },
    { id: 19, question: "What is ARP Spoofing?", answer: "ARP spoofing is an attack where fake ARP messages are sent to associate the attacker's MAC address with another device's IP address.\n\nPurpose:\n- Traffic interception\n- Man-in-the-middle attacks", tags: ["attacks","network"] },
    { id: 20, question: "What is a DMZ?", answer: "DMZ (Demilitarized Zone) is a separate network area used to host public-facing servers securely.\n\nPurpose: Isolate public servers from internal network.\n\nExamples: Web servers, Email servers.", tags: ["network","security"] },
    { id: 21, question: "Difference Between Symmetric and Asymmetric Encryption", answer: "| Symmetric | Asymmetric |\n|---|---|\n| Same key used | Public/private key pair |\n| Faster | Slower |\n| Example: AES | Example: RSA |", tags: ["encryption"] },
    { id: 22, question: "What is RBAC?", answer: "RBAC (Role-Based Access Control) gives permissions based on job roles.\n\nExamples:\n- Manager\n- Administrator\n- Student", tags: ["security"] },
    { id: 23, question: "What is the Principle of Least Privilege?", answer: "Users should receive only the minimum permissions necessary to perform their tasks.\n\nPurpose:\n- Reduce security risks\n- Prevent misuse", tags: ["security"] },
    { id: 24, question: "What Does a Firewall Do?", answer: "A firewall filters network traffic based on predefined security rules.\n\nFunctions:\n- Allow trusted traffic\n- Block malicious traffic", tags: ["network","security"] },
    { id: 25, question: "Which OSI Layer Manages Sessions?", answer: "The Session Layer (Layer 5) establishes, maintains, and terminates communication sessions.", tags: ["network"] },
    { id: 26, question: "What is Protected Health Information (PHI)?", answer: "PHI refers to sensitive medical information related to patients.\n\nExamples:\n- Medical history\n- Test results\n- Health records", tags: ["security"] },
    { id: 27, question: "What is MTTD?", answer: "MTTD means Mean Time to Detect.\n\nIt measures how quickly a security team detects incidents.", tags: ["security"] },
    { id: 28, question: "What is IP Spoofing?", answer: "IP spoofing is forging the source IP address in packets to hide attacker identity.", tags: ["attacks","network"] },
    { id: 29, question: "What is NAT?", answer: "NAT (Network Address Translation) allows multiple private devices to share one public IP address.", tags: ["network"] },
    { id: 30, question: "Which Linux User Overrides Permissions?", answer: "The root user can override all file permissions in Linux.", tags: ["security"] },
    { id: 31, question: "What is System Hardening?", answer: "System hardening reduces vulnerabilities by securing systems.\n\n**Techniques**\n- Disable unused services\n- Apply patches\n- Strong passwords\n- Firewall configuration", tags: ["security"] },
    { id: 32, question: "Why is Monitoring Important After Hardening?", answer: "Hardening alone cannot stop all attacks.\n\nMonitoring helps:\n- Detect suspicious activity\n- Identify breaches\n- Respond quickly", tags: ["security"] },
    { id: 33, question: "Explain Symmetric Encryption", answer: "Symmetric encryption uses the same key for encryption and decryption.\n\n**Advantages**: Fast, Efficient\n\n**Example**: AES", tags: ["encryption"] },
    { id: 34, question: "Explain Asymmetric Encryption", answer: "Asymmetric encryption uses a public key and a private key.\n\n**Advantages**: Secure key exchange, Digital signatures\n\n**Example**: RSA", tags: ["encryption"] },
    { id: 35, question: "What is Hashing?", answer: "Hashing converts data into a fixed-length value.\n\nPurpose: Integrity verification\n\nExample: SHA-256", tags: ["encryption"] },
    { id: 36, question: "Explain PKI in Secure Communication", answer: "PKI supports secure communication through:\n- Digital certificates\n- Public/private keys\n- Certificate Authorities\n\nIt enables:\n- Authentication\n- Encryption\n- Secure HTTPS communication", tags: ["encryption","security"] },
    { id: 37, question: "What is AAA?", answer: "AAA stands for Authentication, Authorization, Accounting.\n\n**Authentication** – Verifies identity.\n**Authorization** – Controls permissions.\n**Accounting** – Tracks user activities.", tags: ["security","network"] },
    { id: 38, question: "What is SSH?", answer: "SSH (Secure Shell) provides secure remote access to network devices using encrypted communication.", tags: ["network","encryption"] },
    { id: 39, question: "What is ACL?", answer: "ACL (Access Control List) is a set of rules used to permit or deny network traffic.", tags: ["network","security"] },
    { id: 40, question: "What is the Purpose of IPSec VPN?", answer: "IPSec VPN provides:\n- Confidentiality\n- Integrity\n- Secure communication over the Internet\n\nIt encrypts data tunnels between networks.", tags: ["network","encryption"] },
    
    // ****************** NEW 40 QUESTIONS (IDs 41-80) ******************
    { id: 41, question: "What is Zero Trust Security Model?", answer: "Zero Trust is a security framework that assumes no user or device is trusted by default, even inside the network perimeter.\n\n**Core principles:**\n- Verify explicitly\n- Least privilege access\n- Assume breach\n- Micro-segmentation", tags: ["security"] },
    { id: 42, question: "What is SASE (Secure Access Service Edge)?", answer: "SASE converges network security and WAN capabilities into a single cloud-delivered service.\n\n**Components:**\n- SD-WAN\n- SWG (Secure Web Gateway)\n- CASB\n- ZTNA\n- Firewall as a Service", tags: ["network","security"] },
    { id: 43, question: "What is a Man-in-the-Middle (MITM) Attack?", answer: "A MITM attack occurs when an attacker secretly intercepts and relays communication between two parties.\n\n**Prevention:**\n- End-to-end encryption\n- Mutual authentication\n- TLS/SSL certificates", tags: ["attacks"] },
    { id: 44, question: "What is a DNS Spoofing Attack?", answer: "DNS spoofing (DNS cache poisoning) corrupts DNS cache to redirect users to malicious websites.\n\n**Mitigation:**\n- DNSSEC\n- Random source ports\n- DNS filtering", tags: ["attacks","network"] },
    { id: 45, question: "What is a Replay Attack?", answer: "A replay attack captures valid data transmission and retransmits it to deceive the receiver.\n\n**Defenses:**\n- Timestamps\n- Session tokens\n- Nonce (number used once)\n- Sequence numbers", tags: ["attacks"] },
    { id: 46, question: "What is a Cross-Site Scripting (XSS) Attack?", answer: "XSS injects malicious scripts into trusted websites, executed in victims' browsers.\n\n**Types:**\n- Stored XSS\n- Reflected XSS\n- DOM-based XSS\n\n**Prevention:** Input validation, output encoding, CSP headers.", tags: ["attacks"] },
    { id: 47, question: "What is SQL Injection?", answer: "SQL injection inserts malicious SQL code into database queries to manipulate or extract data.\n\n**Prevention:**\n- Parameterized queries\n- Prepared statements\n- Input sanitization\n- Least privilege DB accounts", tags: ["attacks"] },
    { id: 48, question: "What is a Phishing Attack?", answer: "Phishing tricks users into revealing sensitive information via fake emails or websites.\n\n**Variants:** Spear phishing, Whaling, Vishing, Smishing.\n\n**Prevention:** User awareness, MFA, email filtering, anti-phishing tools.", tags: ["attacks"] },
    { id: 49, question: "What is a Rogue Access Point?", answer: "A rogue AP is an unauthorized wireless access point installed on a network without administrator consent, creating backdoor access.\n\n**Detection:** Wireless intrusion prevention (WIPS), regular site surveys.", tags: ["network","attacks"] },
    { id: 50, question: "What is a SYN Flood Attack?", answer: "SYN flood is a DDoS attack exploiting TCP handshake by sending many SYN requests without completing ACK, exhausting server resources.\n\n**Mitigation:** SYN cookies, increased backlog, rate limiting.", tags: ["attacks","network"] },
    { id: 51, question: "What is a Smurf Attack?", answer: "Smurf attack uses ICMP echo requests with spoofed victim IP to broadcast addresses, amplifying traffic.\n\n**Prevention:** Disable IP-directed broadcasts, filter ICMP.", tags: ["attacks"] },
    { id: 52, question: "What is a Ping of Death?", answer: "Attack sends malformed oversized ICMP packets exceeding IP fragmentation limits, causing system crashes.\n\n**Mitigation:** Patch systems, packet filtering.", tags: ["attacks"] },
    { id: 53, question: "What is TLS 1.3 and how is it better?", answer: "TLS 1.3 improves security and speed by removing obsolete ciphers, enforcing forward secrecy, and reducing handshake latency (1-RTT or 0-RTT).", tags: ["encryption","network"] },
    { id: 54, question: "What is QUIC protocol?", answer: "QUIC (Quick UDP Internet Connections) is a transport layer protocol developed by Google, using UDP with built-in TLS 1.3 encryption, reducing connection latency.", tags: ["network","encryption"] },
    { id: 55, question: "What is a Web Application Firewall (WAF)?", answer: "A WAF filters, monitors, and blocks HTTP/HTTPS traffic to and from web applications, protecting against OWASP Top 10 threats like XSS and SQLi.", tags: ["network","security"] },
    { id: 56, question: "What is CASB (Cloud Access Security Broker)?", answer: "CASB is a security policy enforcement point between cloud service users and providers, offering visibility, data security, threat protection, and compliance.", tags: ["security"] },
    { id: 57, question: "What is the MITRE ATT&CK Framework?", answer: "MITRE ATT&CK is a globally accessible knowledge base of adversary tactics, techniques, and procedures (TTPs) used for threat modeling and defense.", tags: ["security"] },
    { id: 58, question: "What is Threat Hunting?", answer: "Threat hunting is proactive searching for undetected threats in a network by analyzing data and hypotheses, rather than waiting for alerts.", tags: ["security"] },
    { id: 59, question: "What is UEBA (User and Entity Behavior Analytics)?", answer: "UEBA uses machine learning to detect anomalous behavior of users and devices, identifying insider threats or compromised accounts.", tags: ["security"] },
    { id: 60, question: "What is EDR (Endpoint Detection and Response)?", answer: "EDR continuously monitors and responds to endpoint threats, providing visibility, threat hunting, and automated remediation.", tags: ["security"] },
    { id: 61, question: "What is a Honeypot in Network Security?", answer: "A honeypot is a decoy system designed to lure attackers, monitor their activities, and study attack methods without risking real assets.", tags: ["network","security"] },
    { id: 62, question: "What is the Principle of Defense in Depth?", answer: "Defense in depth uses layered security controls (physical, technical, administrative) so that if one layer fails, others block the attack.", tags: ["security"] },
    { id: 63, question: "What is the Difference Between Vulnerability, Threat, and Risk?", answer: "- **Vulnerability**: a weakness.\n- **Threat**: a potential danger exploiting vulnerability.\n- **Risk**: likelihood of threat exploiting vulnerability impacting assets.", tags: ["security"] },
    { id: 64, question: "What is a Security Posture?", answer: "Security posture is an organization's overall cybersecurity strength, including policies, controls, awareness, and response capabilities.", tags: ["security"] },
    { id: 65, question: "What is Blockchain Security?", answer: "Blockchain security uses cryptographic hashing, decentralization, and consensus mechanisms to ensure data immutability, integrity, and transparency.", tags: ["encryption","security"] },
    { id: 66, question: "What is Homomorphic Encryption?", answer: "Homomorphic encryption allows computation on encrypted data without decrypting it, preserving privacy in cloud computing and analytics.", tags: ["encryption"] },
    { id: 67, question: "What is a Side-Channel Attack?", answer: "Side-channel attacks exploit physical characteristics like power consumption, timing, electromagnetic leaks, or sound to extract secrets.", tags: ["attacks"] },
    { id: 68, question: "What is a Birthday Attack?", answer: "Birthday attack exploits probability collisions in hash functions, often used to find two different inputs producing the same hash (collision).", tags: ["attacks","encryption"] },
    { id: 69, question: "What is a Rainbow Table Attack?", answer: "Rainbow table attack uses precomputed hash chains to reverse cryptographic hashes quickly, defeated by salting passwords.", tags: ["attacks"] },
    { id: 70, question: "What is SSL Stripping?", answer: "SSL stripping downgrades HTTPS connections to HTTP, enabling MITM interception. Defended with HSTS (HTTP Strict Transport Security).", tags: ["attacks","network"] },
    { id: 71, question: "What is an On-Path Attack?", answer: "On-path attack (formerly MITM) positions attacker between two endpoints to intercept/modify traffic, common on unencrypted Wi-Fi.", tags: ["attacks"] },
    { id: 72, question: "What is Wireless Intrusion Prevention System (WIPS)?", answer: "WIPS monitors wireless spectrum for rogue APs, unauthorized devices, and attacks (deauth, evil twin), automatically mitigating threats.", tags: ["network","security"] },
    { id: 73, question: "What is IEEE 802.1X?", answer: "IEEE 802.1X is port-based network access control providing authentication to devices before network access using EAP (Extensible Authentication Protocol).", tags: ["network","security"] },
    { id: 74, question: "What is RADIUS and TACACS+?", answer: "- **RADIUS**: UDP, combines authentication and authorization, used for network access.\n- **TACACS+**: TCP, separates AAA functions, used for device administration.", tags: ["network","security"] },
    { id: 75, question: "What is a Jump Server (Bastion Host)?", answer: "A jump server is a hardened, dedicated system used to access and manage devices in secure zones, providing audit trail and access control.", tags: ["network","security"] },
    { id: 76, question: "What is Network Segmentation?", answer: "Network segmentation divides a network into smaller isolated segments (VLANs, subnets) to contain breaches, improve performance, and enforce policies.", tags: ["network","security"] },
    { id: 77, question: "What is Micro-segmentation?", answer: "Micro-segmentation isolates workloads at the hypervisor or container level, applying granular policies even inside data centers, essential for Zero Trust.", tags: ["network","security"] },
    { id: 78, question: "What is SOAR (Security Orchestration, Automation, and Response)?", answer: "SOAR platforms integrate with SIEM, automate incident response workflows, and orchestrate security tools to accelerate threat remediation.", tags: ["security"] },
    { id: 79, question: "What is a False Positive vs False Negative?", answer: "- **False Positive**: legitimate activity flagged as malicious (wastes time).\n- **False Negative**: actual attack not detected (dangerous).", tags: ["security"] },
    { id: 80, question: "What is the Importance of Patch Management?", answer: "Patch management regularly updates software to fix vulnerabilities, reducing exploitation risk. Critical for compliance and security hygiene.", tags: ["security"] }
  ];

  function formatAnswerText(text) {
    let lines = text.split('\n');
    let inTable = false;
    let htmlLines = [];
    for (let i = 0; i < lines.length; i++) {
      let line = lines[i];
      if (line.trim().startsWith('|') && line.includes('|')) {
        if (!inTable) {
          htmlLines.push('<table class="comparison-table">');
          inTable = true;
        }
        let cells = line.split('|').filter(cell => cell.trim() !== '');
        if (cells.length > 0 && line.includes('---')) continue;
        let isHeader = (i === 0 || (i > 0 && lines[i-1] && lines[i-1].includes('---'))) && cells.length > 0;
        let rowType = isHeader ? 'th' : 'td';
        let rowHtml = '<tr>';
        cells.forEach(cell => rowHtml += `<${rowType}>${cell.trim()}</${rowType}>`);
        rowHtml += '</tr>';
        htmlLines.push(rowHtml);
      } else {
        if (inTable) { htmlLines.push('</table>'); inTable = false; }
        let processed = line.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
        if (processed.trim() !== '') htmlLines.push(`<p>${processed}</p>`);
        else if (line === '') htmlLines.push('<br>');
      }
    }
    if (inTable) htmlLines.push('</table>');
    let result = htmlLines.join('');
    result = result.replace(/^- /gm, '• ');
    return result;
  }

  function escapeHtml(str) {
    if (!str) return "";
    return str.replace(/[&<>]/g, function(m) {
      if (m === '&') return '&amp;';
      if (m === '<') return '&lt;';
      if (m === '>') return '&gt;';
      return m;
    });
  }

  let currentFilter = "all";
  let currentSearch = "";

  function renderCards() {
    const container = document.getElementById("qaContainer");
    const searchLower = currentSearch.trim().toLowerCase();
    const filtered = securityQA.filter(item => {
      if (currentFilter !== "all" && !item.tags.includes(currentFilter)) return false;
      if (searchLower === "") return true;
      return item.question.toLowerCase().includes(searchLower) || 
             item.answer.toLowerCase().includes(searchLower) ||
             item.id.toString().includes(searchLower);
    });
    document.getElementById("statsDisplay").innerText = `📄 ${filtered.length} / ${securityQA.length} questions`;
    if (filtered.length === 0) {
      container.innerHTML = `<div style="grid-column:1/-1; text-align:center; padding:3rem;">🔍 No matching security concepts. Try another keyword.</div>`;
      return;
    }
    container.innerHTML = filtered.map(item => `
      <div class="qa-card">
        <div class="card-header">
          <div class="q-num">Q${item.id}</div>
          <div class="question">${escapeHtml(item.question)}</div>
        </div>
        <div class="card-body">
          <div class="answer">${formatAnswerText(item.answer)}</div>
          <div class="tag">🏷️ ${item.tags.join(', ')}</div>
        </div>
      </div>
    `).join('');
  }

  function update() { renderCards(); }
  document.getElementById("searchInput").addEventListener("input", (e) => { currentSearch = e.target.value; update(); });
  document.querySelectorAll(".filter-btn").forEach(btn => {
    btn.addEventListener("click", () => {
      document.querySelectorAll(".filter-btn").forEach(b => b.classList.remove("active"));
      btn.classList.add("active");
      currentFilter = btn.getAttribute("data-filter");
      update();
    });
  });
  update();
</script>
</body>
</html>
